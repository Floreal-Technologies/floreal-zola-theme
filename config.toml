# The demo site the theme serves to itself. `zola serve` at the root of this
# repository builds it, so a change to a template can be looked at without a
# second repository. A site that uses the theme writes its own config.toml and
# puts the theme under themes/floreal/; see the README.
base_url = "https://example.org"
title = "Floréal"
description = "A house front, and the notes it keeps."
default_language = "en"
compile_sass = true
generate_feeds = true
build_search_index = false

taxonomies = [
  { name = "tags", feed = true },
  { name = "categories", feed = true },
]

[languages.fr]
title = "Floréal"
description = "Une façade, et les notes qu'elle garde."
generate_feeds = true
taxonomies = [
  { name = "tags", feed = true },
  { name = "categories", feed = true },
]

[extra]
# No photograph is kept in this repository, so the demo is read against the
# palette of :root.
default_backdrop = ""
backdrops = []
date_format = "%Y-%m-%d"

[[extra.languages]]
code = "en"
path = "/"
label = "EN"

[[extra.languages]]
code = "fr"
path = "/fr/"
label = "FR"

[[extra.friends]]
name = "A House We Keep Company With"
url = "https://example.com"

[[extra.nav]]
key = "blog"
path = "blog/"

[translations]
home_label = "Home"
products_label = "What we make"
breadcrumb_nav = "Breadcrumb"
language_nav = "Language"
background_nav = "Background"
friends = "We keep company with"
