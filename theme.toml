name = "Floréal"
description = "A theme with a full-bleed backdrop that the reader can switch, a header bar with the pages, a landing card, items, a blog, and any number of languages."
license = "GPL-3.0-only"
homepage = "https://github.com/Floreal-Technologies/floreal-technologies.github.io"
min_version = "0.23.0"
demo = "https://floreal.tech"

[author]
name = "Floréal Technologies"
homepage = "https://floreal.tech"

# The [extra] keys the theme reads, with their defaults. Zola merges this table
# under the [extra] table of the site, key by key. A site sets only what it
# changes. A site that sets nothing still builds. README.md, "Configuration",
# gives what each key does.
[extra]
default_backdrop = ""
backdrops = []
backdrop_credits = {}
friends = []
nav = []
labels = {}
language_labels = {}
language_order = []
date_format = "%Y-%m-%d"
meta_taxonomy = "categories"
favicon = ""

# Justified article text, broken by justif. Off by default: it fetches a
# third-party script that holds the first paint. README.md, "Justified text".
[extra.justif]
enabled = false
src = "https://cdn.jsdelivr.net/npm/justif@0.9.1/dist/auto.js"
integrity = "sha384-Vb3imj2Dz+GDKt+QWPv0OfksiGXnqOAruRF7Uxdw0WEejuoPzDt8+AjL9JzmkzDt"

# The theme strings. A site translates one string by naming that key under
# [extra.strings.<lang>]. The rest fall back to the English here, so a
# part-translated language still reads correctly.
[extra.strings.en]
home_label = "Home"
breadcrumb_nav = "Breadcrumb"
language_nav = "Language"
background_nav = "Background"
nav_label = "Pages"
friends = "We keep company with"
not_found = "This page is not here."
back_home = "Back to the front"
pagination_nav = "Pages of articles"
newer = "Newer"
older = "Older"
article_nav = "Other articles"
newer_article = "Newer"
older_article = "Older"
